<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Feedback — Learning Folks</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="container">
        <!-- Top Navigation -->
        <nav class="navbar">
            <a href="./index.html" class="brand">
                <i class="fa-solid fa-arrow-left"></i> Back to Portfolio
            </a>
            <button class="theme-toggle-button" id="theme-toggle" aria-label="Toggle visual theme">
                <i class="fa-solid fa-moon"></i> Dark Mode
            </button>
        </nav>

        <header class="hero">
            <h1>Leave Feedback</h1>
            <p>Have comments, suggestions, or ideas for any of the projects? Let me know below.</p>
        </header>

        <main>
            <section class="card-section">
                <form id="feedback-form" action="https://formspree.io/f/mqadvwvo" method="post">
                    <div class="form-group">
                        <label for="name">Your Name (Optional)</label>
                        <input type="text" id="name" name="name" placeholder="Alex Smith">
                    </div>

                    <div class="form-group">
                        <label for="email">Your Email (Optional, if you'd like a reply)</label>
                        <input type="email" id="email" name="email" placeholder="alex@example.com">
                    </div>

                    <div class="form-group">
                        <label for="project">Project / Tool (Optional)</label>
                        <input type="text" id="project" name="project" placeholder="e.g. Adawriter, Adventure Books">
                    </div>

                    <div class="form-group">
                        <label for="message">Your Message</label>
                        <textarea id="message" name="message" rows="6" placeholder="Write your thoughts here..." required></textarea>
                    </div>

                    <button type="submit" class="btn-primary">Submit Feedback</button>
                </form>
                <p id="form-status" style="margin-top: 1rem; font-weight: 500;"></p>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Jonathan Corcoran &middot; Learning Folks</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('theme-toggle');
            const body = document.body;
            const feedbackForm = document.getElementById('feedback-form');

            function setTheme(theme) {
                if (theme === 'dark') {
                    body.classList.add('dark-mode');
                    themeToggle.innerHTML = '<i class="fa-solid fa-sun"></i> Light Mode';
                    localStorage.setItem('theme', 'dark');
                } else {
                    body.classList.remove('dark-mode');
                    themeToggle.innerHTML = '<i class="fa-solid fa-moon"></i> Dark Mode';
                    localStorage.setItem('theme', 'light');
                }
            }

            themeToggle.addEventListener('click', () => {
                setTheme(body.classList.contains('dark-mode') ? 'light' : 'dark');
            });

            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                setTheme('dark');
            } else {
                setTheme('light');
            }

            feedbackForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                const form = event.target;
                const data = new FormData(form);
                const status = document.getElementById('form-status');

                try {
                    const response = await fetch(form.action, {
                        method: form.method,
                        body: data,
                        headers: { 'Accept': 'application/json' }
                    });

                    if (response.ok) {
                        status.textContent = "Thank you! Your feedback has been received.";
                        status.style.color = "var(--primary)";
                        form.reset();
                    } else {
                        status.textContent = "Oops! There was a problem submitting your feedback.";
                        status.style.color = "#e11d48";
                    }
                } catch {
                    status.textContent = "Oops! There was a problem submitting your feedback.";
                    status.style.color = "#e11d48";
                }
            });
        });
    </script>
</body>
</html>
